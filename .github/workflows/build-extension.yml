name: Build Chrome Extension ZIP

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate project
        run: node scripts/validate.mjs
      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION=$(node -p "require('./extension/manifest.json').version")
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
      - name: Generate extension icons and store graphics
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.0.0
          python scripts/generate_store_assets.py
      - name: Package extension for Chrome Web Store
        run: |
          mkdir -p dist
          cd extension
          zip -r ../dist/universal-ad-skip-extension.zip . -x '*.DS_Store'
          cd ../dist
          unzip -t universal-ad-skip-extension.zip
          unzip -p universal-ad-skip-extension.zip manifest.json > /dev/null
          unzip -p universal-ad-skip-extension.zip icon-128.png > /dev/null
      - name: Upload installable source ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-ad-skip-extension
          path: dist/universal-ad-skip-extension.zip
      - name: Upload Chrome Web Store images as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-ad-skip-store-images
          path: store-assets/*.png
      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/universal-ad-skip-extension.zip --title "Universal Ad Skip ${GITHUB_REF_NAME}" --generate-notes
